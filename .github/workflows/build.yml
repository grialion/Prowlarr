name: Build

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Restore Yarn cache dir
        id: yarn-cache-dir
        run: echo "dir=$(yarn cache dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Yarn + node_modules
        uses: actions/cache@v4
        with:
          path: |
            ${{ steps.yarn-cache-dir.outputs.dir }}
            node_modules
          key: ${{ runner.os }}-yarn-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.props', '**/*.targets', 'global.json', 'NuGet.config') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Yarn install
        run: yarn install --frozen-lockfile --network-timeout 120000

      - name: Build frontend
        run: yarn run build --env production

      - name: Build backend (linux-musl-x64)
        run: |
          dotnet msbuild -restore src/Prowlarr.sln \
            -p:SelfContained=True \
            -p:Configuration=Release \
            -p:Platform=Posix \
            -p:RuntimeIdentifiers=linux-musl-x64 \
            -t:PublishAllRids

      - name: Package linux-musl-x64
        run: |
          folder="_artifacts/linux-musl-x64/net8.0/Prowlarr"
          mkdir -p "$folder"
          cp -r _output/net8.0/linux-musl-x64/publish/* "$folder"
          cp -r _output/Prowlarr.Update/net8.0/linux-musl-x64/publish "$folder/Prowlarr.Update"
          cp -r _output/UI "$folder"
          cp LICENSE "$folder"
          rm -f "$folder"/ServiceUninstall.*
          rm -f "$folder"/ServiceInstall.*
          rm -f "$folder"/Prowlarr.Windows.*
          cp "$folder"/Prowlarr.Mono.* "$folder/Prowlarr.Update" || true
          cp "$folder"/Mono.Posix.NETStandard.* "$folder/Prowlarr.Update" || true
          cp "$folder"/libMonoPosixHelper.* "$folder/Prowlarr.Update" || true

      - name: Create tar.gz (files at archive root)
        run: |
          cd _artifacts/linux-musl-x64/net8.0/Prowlarr
          tar -czf ../Prowlarr.linux-musl-x64.net8.0.tar.gz .

      - uses: actions/upload-artifact@v4
        with:
          name: Prowlarr.linux-musl-x64.net8.0
          path: _artifacts/linux-musl-x64/net8.0/Prowlarr.linux-musl-x64.net8.0.tar.gz
          archive: false
